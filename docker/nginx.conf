server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;

    # Relative Location headers: redirects keep working behind an HTTPS reverse proxy.
    absolute_redirect off;

    charset utf-8;
    charset_types text/markdown text/plain text/css application/javascript application/json;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/markdown text/xml application/xml application/javascript application/json image/svg+xml;

    # Hidden files, including the temporary folders of generate.sh.
    location ~ /\. {
        return 404;
    }

    # Generated by generate.sh, only served through the routes below.
    location ^~ /_pages/ {
        internal;
    }

    location ^~ /_md/ {
        internal;
    }

    # Assets from the mounted folder (images, PDFs…).
    location ^~ /content/ {
        alias /content/;
        default_type text/markdown;
        location ~ /\. {
            return 404;
        }
    }

    # Raw markdown: /guides/install.md → /_md/guides/install.md (symlink to the source file).
    location ~ ^/(?<slug>.+)\.md$ {
        default_type text/markdown;
        add_header Cache-Control "no-cache";
        # Duplicate of the HTML page for search engines.
        add_header X-Robots-Tag "noindex";
        try_files /_md/$slug.md =404;
    }

    location ~ ^/(index\.html|content\.json|config\.js|sitemap\.xml|robots\.txt|llms\.txt)$ {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Single page app: each page has its own HTML (title, description, Open Graph…),
    # unknown routes get the app with a 404 status.
    location = / {
        add_header Cache-Control "no-cache";
        try_files /_pages/index.html =404;
        error_page 404 /index.html;
    }

    location / {
        rewrite ^/(.+)/$ /$1 permanent;
        add_header Cache-Control "no-cache";
        try_files $uri /_pages$uri.html =404;
        error_page 404 /index.html;
    }
}
